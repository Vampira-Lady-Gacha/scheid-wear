{% extends "admin/base.html" %}
{% block titulo %}Minha senha{% endblock %}

{% block conteudo %}
<div class="painel-cabeca"><h1>Minha senha</h1></div>
{% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
<form class="bloco estreito" method="post" action="/admin/conta">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <p class="bloco-nota">Entrando como {{ usuario.email }}.</p>
  <div class="pilha">
    <label class="campo"><span>Senha atual</span><input class="entrada" type="password" name="senha_atual" autocomplete="current-password" required></label>
    <label class="campo"><span>Nova senha</span><input class="entrada" type="password" name="senha_nova" autocomplete="new-password" minlength="8" required><small>Pelo menos 8 caracteres.</small></label>
    <label class="campo"><span>Repita a nova senha</span><input class="entrada" type="password" name="senha_confirma" autocomplete="new-password" minlength="8" required></label>
  </div>
  <p class="bloco-acoes"><button class="botao" type="submit">Trocar senha</button></p>
</form>
{% endblock %}
