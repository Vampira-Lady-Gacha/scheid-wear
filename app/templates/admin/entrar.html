<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · {{ loja.nome_loja }}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/fontes.css?v={{ VERSAO_ESTATICOS }}">
  <link rel="stylesheet" href="/static/css/loja.css?v={{ VERSAO_ESTATICOS }}">
  <link rel="stylesheet" href="/static/css/admin.css?v={{ VERSAO_ESTATICOS }}">
</head>
<body class="entrar-corpo">
  <main class="entrar-pagina">
    <form class="tag tag-grande entrar-tag" method="post" action="/admin/entrar">
      <span class="tag-furo" aria-hidden="true"></span>
      <div class="tag-corpo">
        <p class="tag-numero rotulo-impresso"><span>{{ loja.nome_loja }}</span><span>Área da equipe</span></p>
        <h1 class="tag-nome">Entrar no painel</h1>
        <input type="hidden" name="csrf" value="{{ csrf }}">
        {% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
        <label class="campo"><span>E-mail</span><input class="entrada" type="email" name="email" autocomplete="username" required autofocus></label>
        <label class="campo"><span>Senha</span><input class="entrada" type="password" name="senha" autocomplete="current-password" required></label>
        <button class="botao botao-largo" type="submit">Entrar</button>
        <a class="link-simples" href="/">Voltar para a loja</a>
      </div>
    </form>
  </main>
</body>
</html>
